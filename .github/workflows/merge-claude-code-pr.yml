name: Merge claude-code PR

# Renovate only merges its claude-code-nix PRs on its own (irregular) runs,
# so a morning `machine provision` can still miss the latest version.
# Merge any open one before the workday starts.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-claude-code-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge open claude-code-nix PRs
        id: merge
        run: |
          set -euo pipefail
          prs="$(gh pr list --author app/renovate \
            --search "sadjow/claude-code-nix in:title" \
            --json number --jq '.[].number')"
          if [ -z "$prs" ]; then
            echo "No open claude-code-nix PR"
            exit 0
          fi
          for pr in $prs; do
            gh pr merge "$pr" --squash --delete-branch
          done
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger the push workflow,
      # so start the machine hash bump explicitly.
      - name: Update machine hash
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run update-machine-hash.yml --ref main
